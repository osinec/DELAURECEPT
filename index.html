<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор рецептов — уютно и красиво</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg:        #fdfaf7;
      --card:      #ffffff;
      --text:      #2d1e12;
      --text-light:#6b5a4a;
      --accent:    #e07a5f;
      --accent-dark:#c95f45;
      --border:    #f0e6df;
      --shadow-sm: 0 4px 12px rgba(0,0,0,0.06);
      --shadow-md: 0 10px 30px rgba(0,0,0,0.08);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      padding: 32px 16px;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3.2rem;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .subtitle {
      color: var(--text-light);
      font-size: 1.15rem;
      max-width: 560px;
      margin: 0 auto;
    }

    .recipe-block {
      background: var(--card);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 40px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }

    .recipe-block:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    }

    .recipe-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .recipe-header h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      color: var(--accent);
      margin: 0;
    }

    .remove-btn {
      background: #f4c7c3;
      color: #a94442;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .remove-btn:hover { background: #e8b4af; }

    label {
      display: block;
      margin: 16px 0 6px;
      font-weight: 500;
      color: var(--text-light);
      font-size: 0.95rem;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      background: #fffefb;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(224,122,95,0.12);
    }

    input[readonly] {
      background: #f8f5f2;
      color: #8b6f5a;
      cursor: default;
    }

    .ingredients-container, .steps-container { margin-top: 24px; }

    .ingredient-row, .step-row {
      display: grid;
      gap: 12px;
      margin-bottom: 12px;
      align-items: center;
    }

    .ingredient-row { grid-template-columns: 2fr 1fr 100px 140px 44px; }
    .step-row       { grid-template-columns: 1fr 44px; }

    .add-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 12px;
    }

    .add-btn:hover { background: var(--accent-dark); }

    .global-actions {
      text-align: center;
      margin: 48px 0 40px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    button.big {
      font-size: 1.2rem;
      padding: 16px 40px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
      border: none;
    }

    #add-recipe-btn {
      background: #a8d5ba;
      color: #2d5a3f;
    }

    #add-recipe-btn:hover {
      background: #92c4a4;
      transform: translateY(-2px);
    }

    #generate-btn {
      background: var(--accent);
      color: white;
    }

    #generate-btn:hover {
      background: var(--accent-dark);
      transform: translateY(-2px);
    }

    #copy-btn {
      background: #b8d4f5;
      color: #2a4365;
    }

    #copy-btn:hover {
      background: #a5c4e8;
      transform: translateY(-2px);
    }

    #copy-btn.copied {
      background: #a8d5ba !important;
      color: #2d5a3f !important;
    }

    #output {
      background: #2d1e12;
      color: #f5e9d8;
      padding: 24px;
      border-radius: 16px;
      font-family: 'Courier New', monospace;
      white-space: pre-wrap;
      max-height: 600px;
      overflow-y: auto;
      box-shadow: var(--shadow-md);
      line-height: 1.5;
      font-size: 0.98rem;
    }

    .empty-state {
      text-align: center;
      color: var(--text-light);
      padding: 60px 20px;
      font-size: 1.1rem;
    }

    .importance-legend {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin: 16px 0;
      font-size: 0.9rem;
      color: var(--text-light);
    }
    
    .copy-hint {
      text-align: center;
      color: var(--text-light);
      font-size: 0.9rem;
      margin-top: 8px;
      opacity: 0.8;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Мои рецепты</h1>
    <p class="subtitle">Уютный генератор JSON для твоих любимых блюд 🍳✨</p>
    
    <div class="importance-legend">
      <span>✅ Обязательный</span>
      <span>⭐ Желательный</span>
      <span>➖ Необязательный</span>
    </div>
  </header>

  <div id="recipes-container"></div>

  <div class="global-actions">
    <button id="add-recipe-btn" class="big" onclick="addRecipe()">+ Новый рецепт</button>
    <button id="generate-btn" class="big" onclick="generateJSON()">Создать JSON</button>
    <button id="copy-btn" class="big" onclick="copyJSON()">📋 Копировать</button>
  </div>
  <div class="copy-hint">Нажмите «Копировать», чтобы сохранить JSON в буфер обмена</div>

  <pre id="output" class="empty-state">Здесь появится красивый JSON с твоими рецептами…</pre>
</div>

<script>
// =============================================
// Утилита для генерации slug
// =============================================
function slugify(text) {
  if (!text) return '';
  return text
    .toLowerCase()
    .trim()
    .replace(/\s+/g, '_')
    .replace(/[^а-яёa-z0-9_]/g, '')
    .replace(/_+/g, '_')
    .replace(/^_+|_+$/g, '');
}

// =============================================
// 🔥 НОВЫЙ: Форматирование JSON в компактном стиле
// =============================================
function formatRecipeJSON(data) {
  const isArray = Array.isArray(data);
  const recipes = isArray ? data : [data];
  
  const formatted = recipes.map(recipe => {
    // Форматируем ингредиенты — каждый в одну строку
    const ingredients = recipe.ingredients.map(ing => {
      const qty = typeof ing.quantity === 'number' ? ing.quantity : JSON.stringify(ing.quantity);
      return `    { "ingredientId": ${JSON.stringify(ing.ingredientId)}, "quantity": ${qty}, "unit": ${JSON.stringify(ing.unit)}, "importance": ${ing.importance} }`;
    }).join(',\n');
    
    // Форматируем шаги
    const steps = recipe.steps.map(step => `    ${JSON.stringify(step)}`).join(',\n');
    
    return `  {
    "id": ${JSON.stringify(recipe.id)},
    "title": ${JSON.stringify(recipe.title)},
    "photo": ${JSON.stringify(recipe.photo)},
    "servings": ${recipe.servings},
    "time": ${JSON.stringify(recipe.time)},
    "calories": ${recipe.calories},
    "ingredients": [
${ingredients}
    ],
    "steps": [
${steps}
    ]
  }`;
  }).join(',\n');
  
  return isArray ? `[\n${formatted}\n]` : formatted;
}

let recipeCounter = 0;

function createRecipeBlock() {
  recipeCounter++;
  const blockId = `recipe-${recipeCounter}`;

  const block = document.createElement("div");
  block.className = "recipe-block";
  block.id = blockId;

  block.innerHTML = `
    <div class="recipe-header">
      <h3>Рецепт ${recipeCounter}</h3>
      <button class="remove-btn" onclick="removeRecipe('${blockId}')">Удалить</button>
    </div>

    <label>ID рецепта (генерируется автоматически):</label>
    <input type="text" class="id" placeholder="например_грибной_омлет" readonly>

    <label>Название блюда</label>
    <input type="text" class="title" placeholder="Грибной омлет с травами" required>

    <label>Фото (автоматически: [id].webp)</label>
    <input type="text" class="photo" placeholder="грибной_омлет.webp" readonly>

    <label>Порции</label>
    <input type="number" class="servings" value="1" min="1">

    <label>Время приготовления</label>
    <input type="text" class="time" placeholder="15 минут" value="15 минут">

    <label>Калории (на порцию)</label>
    <input type="number" class="calories" placeholder="280" value="280">

    <div class="ingredients-container">
      <label>Ингредиенты</label>
      <div class="ingredients-rows"></div>
      <button type="button" class="add-btn" onclick="addIngredient('${blockId}')">+ Добавить ингредиент</button>
    </div>

    <div class="steps-container">
      <label>Шаги приготовления</label>
      <div class="steps-rows"></div>
      <button type="button" class="add-btn" onclick="addStep('${blockId}')">+ Добавить шаг</button>
    </div>
  `;

  document.getElementById("recipes-container").appendChild(block);

  // Автогенерация id и photo
  const titleInput = block.querySelector(".title");
  const idInput    = block.querySelector(".id");
  const photoInput = block.querySelector(".photo");

  const updateSlugAndPhoto = () => {
    const slug = slugify(titleInput.value);
    idInput.value    = slug;
    photoInput.value = slug ? `${slug}.webp` : '';
  };

  titleInput.addEventListener("input", updateSlugAndPhoto);
  updateSlugAndPhoto();

  // Добавляем хотя бы по одному полю
  addIngredient(blockId);
  addStep(blockId);
}

function addRecipe() {
  createRecipeBlock();
}

function removeRecipe(blockId) {
  const block = document.getElementById(blockId);
  if (block) block.remove();
}

function addIngredient(blockId) {
  const container = document.querySelector(`#${blockId} .ingredients-rows`);
  if (!container) return;

  const row = document.createElement("div");
  row.className = "ingredient-row";
  row.innerHTML = `
    <input type="text" placeholder="шампиньоны" class="ing-name" required>
    <input type="text" placeholder="180" class="ing-qty" required>
    <select class="ing-unit">
      <option value="г">г</option>
      <option value="шт">шт</option>
      <option value="мл">мл</option>
      <option value="ст.л.">ст.л.</option>
      <option value="по вкусу">по вкусу</option>
      <option value="">—</option>
    </select>
    <select class="ing-importance">
      <option value="2">✅ Обязательный</option>
      <option value="1">⭐ Желательный</option>
      <option value="0">➖ Необязательный</option>
    </select>
    <button type="button" onclick="this.parentElement.remove()" style="background:#f0d0c8; color:#a94442; border:none; padding:8px 12px; border-radius:8px; cursor:pointer; font-weight:600;">×</button>
  `;
  container.appendChild(row);
}

function addStep(blockId) {
  const container = document.querySelector(`#${blockId} .steps-rows`);
  if (!container) return;

  const row = document.createElement("div");
  row.className = "step-row";
  row.innerHTML = `
    <input type="text" placeholder="Нарезать грибы и обжарить на сливочном масле..." class="step-text" required>
    <button type="button" onclick="this.parentElement.remove()" style="background:#f4c7c3; color:#a94442; border:none; padding:8px 12px; border-radius:8px; cursor:pointer; font-weight:600;">×</button>
  `;
  container.appendChild(row);
}

function generateJSON() {
  const recipes = [];

  document.querySelectorAll(".recipe-block").forEach(block => {
    const id     = block.querySelector(".id")?.value?.trim()     || '';
    const title  = block.querySelector(".title")?.value?.trim()  || '';
    const photo  = block.querySelector(".photo")?.value?.trim()  || '';
    const time   = block.querySelector(".time")?.value?.trim()   || '';
    const servings = Number(block.querySelector(".servings")?.value) || 1;
    const calories = Number(block.querySelector(".calories")?.value) || 0;

    if (!id || !title) return;

    const recipe = { id, title, photo, servings, time, calories, ingredients: [], steps: [] };

    block.querySelectorAll(".ingredient-row").forEach(row => {
      const name = row.querySelector(".ing-name")?.value?.trim();
      const qty  = row.querySelector(".ing-qty")?.value?.trim();
      const unit = row.querySelector(".ing-unit")?.value?.trim() || '';
      const importance = Number(row.querySelector(".ing-importance")?.value) ?? 2;

      if (name && qty) {
        recipe.ingredients.push({
          ingredientId: name,
          quantity: isNaN(parseFloat(qty)) ? qty : parseFloat(qty),
          unit,
          importance
        });
      }
    });

    block.querySelectorAll(".step-row input.step-text").forEach(input => {
      const text = input.value.trim();
      if (text) recipe.steps.push(text);
    });

    recipes.push(recipe);
  });

  const output = document.getElementById("output");

  if (recipes.length === 0) {
    output.textContent = "Добавь хотя бы один рецепт с названием и id :)";
    output.className = "empty-state";
    return;
  }

  // 🔥 ИСПОЛЬЗУЕМ НОВЫЙ ФОРМАТТЕР
  const jsonStr = formatRecipeJSON(recipes.length === 1 ? recipes[0] : recipes);
  output.textContent = jsonStr;
  output.className = "";
}

// =============================================
// 🔥 НОВЫЙ: Копирование JSON в буфер обмена
// =============================================
function copyJSON() {
  const output = document.getElementById("output");
  const text = output.textContent;
  
  if (!text || output.classList.contains("empty-state")) {
    alert("Сначала создайте JSON, нажав «Создать JSON»!");
    return;
  }
  
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById("copy-btn");
    const originalText = btn.textContent;
    
    // Визуальная обратная связь
    btn.textContent = "✓ Скопировано!";
    btn.classList.add("copied");
    
    setTimeout(() => {
      btn.textContent = originalText;
      btn.classList.remove("copied");
    }, 2000);
  }).catch(err => {
    console.error("Ошибка копирования:", err);
    alert("Не удалось скопировать в буфер обмена. Попробуйте выделить текст и скопировать вручную (Ctrl+C).");
  });
}

// Первый рецепт при загрузке
window.onload = () => {
  createRecipeBlock();
};
</script>
</body>
</html>
