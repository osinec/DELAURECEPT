<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор рецептов — уютно и красиво</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fdfaf7;
            --card: #ffffff;
            --text: #2d1e12;
            --text-light: #6b5a4a;
            --accent: #e07a5f;
            --accent-dark: #c95f45;
            --border: #f0e6df;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.06);
            --shadow-md: 0 10px 30px rgba(0,0,0,0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding: 32px 16px;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        header {
            text-align: center;
            margin-bottom: 48px;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.2rem;
            color: var(--accent);
            margin-bottom: 12px;
        }
        .subtitle {
            color: var(--text-light);
            font-size: 1.15rem;
            max-width: 560px;
            margin: 0 auto;
        }
        .recipe-block {
            background: var(--card);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 40px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            transition: transform 0.22s ease, box-shadow 0.22s ease;
            position: relative;
        }
        .recipe-block:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .recipe-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        .recipe-header h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--accent);
            margin: 0;
        }
        .remove-btn {
            background: #f4c7c3;
            color: #a94442;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .remove-btn:hover { background: #e8b4af; }
        label {
            display: block;
            margin: 16px 0 6px;
            font-weight: 500;
            color: var(--text-light);
            font-size: 0.95rem;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            background: #fffefb;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(224,122,95,0.12);
        }
        input[readonly] {
            background: #f8f5f2;
            color: #8b6f5a;
            cursor: default;
        }
        .ingredients-container, .steps-container { margin-top: 24px; }
        .ingredient-row, .step-row {
            display: grid;
            gap: 12px;
            margin-bottom: 12px;
            align-items: center;
            position: relative;
        }
        .ingredient-row { grid-template-columns: 2fr 1fr 100px 140px 44px; }
        .step-row { grid-template-columns: 1fr 44px; }
        
        /* Стили для кастомного автокомплита */
        .autocomplete-wrapper {
            position: relative;
            width: 100%;
        }
        .autocomplete-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: var(--shadow-md);
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            margin-top: 4px;
            display: none;
        }
        .autocomplete-dropdown.show {
            display: block;
        }
        .autocomplete-item {
            padding: 10px 14px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
            transition: background 0.15s;
        }
        .autocomplete-item:last-child {
            border-bottom: none;
        }
        .autocomplete-item:hover,
        .autocomplete-item.active {
            background: rgba(224,122,95,0.1);
            color: var(--accent-dark);
        }
        .autocomplete-item .unit-hint {
            color: var(--text-light);
            font-size: 0.85rem;
            margin-left: 8px;
            opacity: 0.8;
        }
        
        .add-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 12px;
        }
        .add-btn:hover { background: var(--accent-dark); }
        .global-actions {
            text-align: center;
            margin: 48px 0 40px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }
        button.big {
            font-size: 1.2rem;
            padding: 16px 40px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            border: none;
        }
        #add-recipe-btn {
            background: #a8d5ba;
            color: #2d5a3f;
        }
        #add-recipe-btn:hover {
            background: #92c4a4;
            transform: translateY(-2px);
        }
        #generate-btn {
            background: var(--accent);
            color: white;
        }
        #generate-btn:hover {
            background: var(--accent-dark);
            transform: translateY(-2px);
        }
        #copy-btn {
            background: #b8d4f5;
            color: #2a4365;
        }
        #copy-btn:hover {
            background: #a5c4e8;
            transform: translateY(-2px);
        }
        #copy-btn.copied {
            background: #a8d5ba !important;
            color: #2d5a3f !important;
        }
        #output {
            background: #2d1e12;
            color: #f5e9d8;
            padding: 24px;
            border-radius: 16px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            max-height: 600px;
            overflow-y: auto;
            box-shadow: var(--shadow-md);
            line-height: 1.5;
            font-size: 0.98rem;
        }
        .empty-state {
            text-align: center;
            color: var(--text-light);
            padding: 60px 20px;
            font-size: 1.1rem;
        }
        .importance-legend {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 16px 0;
            font-size: 0.9rem;
            color: var(--text-light);
        }
        .copy-hint {
            text-align: center;
            color: var(--text-light);
            font-size: 0.9rem;
            margin-top: 8px;
            opacity: 0.8;
        }
        
        /* Скроллбар для красивого вида */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #d4c4b8;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #c95f45;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Мои рецепты</h1>
            <p class="subtitle">Уютный генератор JSON для твоих любимых блюд 🍳✨</p>
            <div class="importance-legend">
                <span>✅ Обязательный</span>
                <span>⭐ Желательный</span>
                <span>➖ Необязательный</span>
            </div>
        </header>

        <div id="recipes-container"></div>

        <div class="global-actions">
            <button id="add-recipe-btn" class="big" onclick="addRecipe()">+ Новый рецепт</button>
            <button id="generate-btn" class="big" onclick="generateJSON()">Создать JSON</button>
            <button id="copy-btn" class="big" onclick="copyJSON()">📋 Копировать</button>
        </div>

        <div class="copy-hint">Нажмите «Копировать», чтобы сохранить JSON в буфер обмена</div>
        <pre id="output" class="empty-state">Здесь появится красивый JSON с твоими рецептами…</pre>
    </div>

    <script>
        // =============================================
        // Глобальные переменные
        // =============================================
        let allIngredients = [];
        let recipeCounter = 0;
        let activeDropdown = null; // Отслеживаем активный дропдаун

        // =============================================
        // Загрузка ingredients.json
        // =============================================
        async function loadIngredients(){
            try {
                const response = await fetch('ingredients.json');
                if (!response.ok) throw new Error('Не удалось загрузить ingredients.json');
                const data = await response.json();
                allIngredients = data.ingredients || [];
                console.log(`Загружено ${allIngredients.length} ингредиентов`);
            } catch(err) {
                console.error('Ошибка загрузки ingredients.json:', err);
                alert('Не удалось загрузить файл ingredients.json.\n\nУбедись, что файл называется точно "ingredients.json" и лежит в одной папке с этим HTML-файлом.');
            }
        }

        // =============================================
        // Утилита для генерации slug
        // =============================================
        function slugify(text){
            if (!text) return '';
            return text
                .toLowerCase()
                .trim()
                .replace(/\s+/g, '_')
                .replace(/[^а-яёa-z0-9_]/g, '')
                .replace(/_+/g, '_')
                .replace(/^_+|_+$/g, '');
        }

        // =============================================
        // Форматирование JSON
        // =============================================
        function formatRecipeJSON(data){
            const isArray = Array.isArray(data);
            const recipes = isArray ? data : [data];
            
            const formatted = recipes.map(recipe => {
                const ingredients = recipe.ingredients.map(ing => {
                    const qty = typeof ing.quantity === 'number' ? ing.quantity : JSON.stringify(ing.quantity);
                    return `    { "ingredientId": ${JSON.stringify(ing.ingredientId)}, "quantity": ${qty}, "unit": ${JSON.stringify(ing.unit)}, "importance": ${ing.importance} }`;
                }).join(',\n');
                
                const steps = recipe.steps.map(step => `    ${JSON.stringify(step)}`).join(',\n');
                
                return `  {
    "id": ${JSON.stringify(recipe.id)},
    "title": ${JSON.stringify(recipe.title)},
    "photo": ${JSON.stringify(recipe.photo)},
    "servings": ${recipe.servings},
    "time": ${JSON.stringify(recipe.time)},
    "calories": ${recipe.calories},
    "ingredients": [
${ingredients}
    ],
    "steps": [
${steps}
    ]
  }`;
            }).join(',\n');
            
            return isArray ? `[\n${formatted}\n]` : formatted;
        }

        // =============================================
        // Создание блока рецепта
        // =============================================
        function createRecipeBlock(){
            recipeCounter++;
            const blockId = `recipe-${recipeCounter}`;
            const block = document.createElement("div");
            block.className = "recipe-block";
            block.id = blockId;
            
            block.innerHTML = `
                <div class="recipe-header">
                    <h3>Рецепт ${recipeCounter}</h3>
                    <button class="remove-btn" onclick="removeRecipe('${blockId}')">Удалить</button>
                </div>
                
                <label>ID рецепта (генерируется автоматически):</label>
                <input type="text" class="id" placeholder="например_грибной_омлет" readonly>
                
                <label>Название блюда</label>
                <input type="text" class="title" placeholder="Грибной омлет с травами" required>
                
                <label>Фото (автоматически: [id].webp)</label>
                <input type="text" class="photo" placeholder="грибной_омлет.webp" readonly>
                
                <label>Порции</label>
                <input type="number" class="servings" value="1" min="1">
                
                <label>Время приготовления</label>
                <input type="text" class="time" placeholder="15 минут" value="15 минут">
                
                <label>Калории (на порцию)</label>
                <input type="number" class="calories" placeholder="280" value="280">
                
                <div class="ingredients-container">
                    <label>Ингредиенты</label>
                    <div class="ingredients-rows"></div>
                    <button type="button" class="add-btn" onclick="addIngredient('${blockId}')">+ Добавить ингредиент</button>
                </div>
                
                <div class="steps-container">
                    <label>Шаги приготовления</label>
                    <div class="steps-rows"></div>
                    <button type="button" class="add-btn" onclick="addStep('${blockId}')">+ Добавить шаг</button>
                </div>
            `;
            
            document.getElementById("recipes-container").appendChild(block);
            
            // Автогенерация id и photo
            const titleInput = block.querySelector(".title");
            const idInput = block.querySelector(".id");
            const photoInput = block.querySelector(".photo");
            
            const updateSlugAndPhoto = () => {
                const slug = slugify(titleInput.value);
                idInput.value = slug;
                photoInput.value = slug ? `${slug}.webp` : '';
            };
            
            titleInput.addEventListener("input", updateSlugAndPhoto);
            updateSlugAndPhoto();
            
            // Добавляем начальные поля
            addIngredient(blockId);
            addStep(blockId);
        }

        // =============================================
        // Кастомный автокомплит для ингредиентов
        // =============================================
        function initAutocomplete(inputElement, unitSelect, hiddenIdInput) {
            const wrapper = document.createElement('div');
            wrapper.className = 'autocomplete-wrapper';
            
            // Перемещаем input внутрь wrapper
            inputElement.parentNode.insertBefore(wrapper, inputElement);
            wrapper.appendChild(inputElement);
            
            // Создаём dropdown
            const dropdown = document.createElement('div');
            dropdown.className = 'autocomplete-dropdown';
            dropdown.id = `dropdown-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
            wrapper.appendChild(dropdown);
            
            // Функция показа списка
            function showDropdown(filterText = '') {
                // Скрываем другие дропдауны
                if (activeDropdown && activeDropdown !== dropdown) {
                    activeDropdown.classList.remove('show');
                }
                activeDropdown = dropdown;
                
                // Фильтруем ингредиенты
                const filtered = allIngredients.filter(ing => 
                    ing.name.toLowerCase().includes(filterText.toLowerCase())
                );
                
                // Очищаем и заполняем
                dropdown.innerHTML = '';
                
                if (filtered.length === 0 && filterText) {
                    const empty = document.createElement('div');
                    empty.className = 'autocomplete-item';
                    empty.textContent = 'Ничего не найдено';
                    empty.style.color = 'var(--text-light)';
                    empty.style.cursor = 'default';
                    dropdown.appendChild(empty);
                } else {
                    const items = filterText ? filtered : allIngredients;
                    items.forEach(ing => {
                        const item = document.createElement('div');
                        item.className = 'autocomplete-item';
                        item.innerHTML = `${ing.name}<span class="unit-hint">(${ing.unit})</span>`;
                        item.dataset.id = ing.id;
                        item.dataset.name = ing.name;
                        item.dataset.unit = ing.unit;
                        
                        item.addEventListener('click', (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            inputElement.value = ing.name;
                            hiddenIdInput.value = ing.id;
                            if (ing.unit && unitSelect) {
                                unitSelect.value = ing.unit;
                            }
                            hideDropdown();
                            inputElement.focus();
                        });
                        
                        // Hover эффект с клавиатурной навигацией
                        item.addEventListener('mouseenter', () => {
                            dropdown.querySelectorAll('.autocomplete-item').forEach(i => i.classList.remove('active'));
                            item.classList.add('active');
                        });
                        
                        dropdown.appendChild(item);
                    });
                }
                
                dropdown.classList.add('show');
            }
            
            // Функция скрытия
            function hideDropdown() {
                dropdown.classList.remove('show');
                if (activeDropdown === dropdown) {
                    activeDropdown = null;
                }
            }
            
            // Обработчики событий
            inputElement.addEventListener('focus', () => {
                showDropdown(inputElement.value);
            });
            
            inputElement.addEventListener('input', () => {
                showDropdown(inputElement.value);
            });
            
            inputElement.addEventListener('blur', (e) => {
                // Не скрываем сразу, если клик был по дропдауну
                setTimeout(() => {
                    if (!dropdown.contains(document.activeElement) && document.activeElement !== inputElement) {
                        hideDropdown();
                    }
                }, 150);
            });
            
            // Поддержка клавиатуры
            inputElement.addEventListener('keydown', (e) => {
                const items = dropdown.querySelectorAll('.autocomplete-item:not([style*="cursor: default"])');
                const activeItem = dropdown.querySelector('.autocomplete-item.active');
                let index = Array.from(items).indexOf(activeItem);
                
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (index < items.length - 1) {
                        if (activeItem) activeItem.classList.remove('active');
                        items[index + 1].classList.add('active');
                        items[index + 1].scrollIntoView({ block: 'nearest' });
                    }
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (index > 0) {
                        if (activeItem) activeItem.classList.remove('active');
                        items[index - 1].classList.add('active');
                        items[index - 1].scrollIntoView({ block: 'nearest' });
                    }
                } else if (e.key === 'Enter' && activeItem) {
                    e.preventDefault();
                    activeItem.click();
                } else if (e.key === 'Escape') {
                    hideDropdown();
                }
            });
            
            // Клик вне компонента закрывает дропдаун
            document.addEventListener('click', (e) => {
                if (!wrapper.contains(e.target) && dropdown.classList.contains('show')) {
                    hideDropdown();
                }
            });
            
            return { showDropdown, hideDropdown };
        }

        // =============================================
        // Добавление ингредиента с кастомным автокомплитом
        // =============================================
        function addIngredient(blockId){
            const container = document.querySelector(`#${blockId} .ingredients-rows`);
            if (!container) return;
            
            const rowId = `ing-row-${Date.now()}`;
            const row = document.createElement("div");
            row.className = "ingredient-row";
            row.id = rowId;
            
            row.innerHTML = `
                <input type="text" placeholder="Начните вводить название ингредиента..." class="ing-name" autocomplete="off" required>
                <input type="text" placeholder="180" class="ing-qty" required>
                <select class="ing-unit">
                    <option value="г">г</option>
                    <option value="шт">шт</option>
                    <option value="мл">мл</option>
                    <option value="ст.л.">ст.л.</option>
                    <option value="по вкусу">по вкусу</option>
                    <option value="">зубч</option>
                </select>
                <select class="ing-importance">
                    <option value="2">✅ Обязательный</option>
                    <option value="1">⭐ Желательный</option>
                    <option value="0">➖ Необязательный</option>
                </select>
                <button type="button" onclick="removeIngredientRow(this)" style="background:#f0d0c8; color:#a94442; border:none; padding:8px 12px; border-radius:8px; cursor:pointer; font-weight:600;">×</button>
                <input type="hidden" class="ing-id">
            `;
            
            container.appendChild(row);
            
            // Инициализируем кастомный автокомплит
            const nameInput = row.querySelector(".ing-name");
            const unitSelect = row.querySelector(".ing-unit");
            const hiddenId = row.querySelector(".ing-id");
            
            if (allIngredients.length > 0) {
                initAutocomplete(nameInput, unitSelect, hiddenId);
            }
        }

        // =============================================
        // Удаление строки ингредиента
        // =============================================
        function removeIngredientRow(button) {
            const row = button.parentElement;
            // Закрываем дропдаун если он открыт в этой строке
            const dropdown = row.querySelector('.autocomplete-dropdown');
            if (dropdown) dropdown.classList.remove('show');
            row.remove();
        }

        // =============================================
        // Добавление шага
        // =============================================
        function addStep(blockId){
            const container = document.querySelector(`#${blockId} .steps-rows`);
            if (!container) return;
            
            const row = document.createElement("div");
            row.className = "step-row";
            row.innerHTML = `
                <input type="text" placeholder="Нарезать грибы и обжарить на сливочном масле..." class="step-text" required>
                <button type="button" onclick="this.parentElement.remove()" style="background:#f4c7c3; color:#a94442; border:none; padding:8px 12px; border-radius:8px; cursor:pointer; font-weight:600;">×</button>
            `;
            container.appendChild(row);
        }

        // =============================================
        // Удаление рецепта
        // =============================================
        function removeRecipe(blockId){
            const block = document.getElementById(blockId);
            if (block) {
                // Закрываем все дропдауны в блоке
                block.querySelectorAll('.autocomplete-dropdown').forEach(d => d.classList.remove('show'));
                block.remove();
            }
        }

        function addRecipe(){
            createRecipeBlock();
        }

        // =============================================
        // Генерация JSON
        // =============================================
        function generateJSON(){
            const recipes = [];
            
            document.querySelectorAll(".recipe-block").forEach(block => {
                const id = block.querySelector(".id")?.value?.trim() || '';
                const title = block.querySelector(".title")?.value?.trim() || '';
                const photo = block.querySelector(".photo")?.value?.trim() || '';
                const time = block.querySelector(".time")?.value?.trim() || '';
                const servings = Number(block.querySelector(".servings")?.value) || 1;
                const calories = Number(block.querySelector(".calories")?.value) || 0;
                
                if (!id || !title) return;
                
                const recipe = {
                    id,
                    title,
                    photo,
                    servings,
                    time,
                    calories,
                    ingredients: [],
                    steps: []
                };
                
                block.querySelectorAll(".ingredient-row").forEach(row => {
                    const nameInput = row.querySelector(".ing-name");
                    const qtyInput = row.querySelector(".ing-qty");
                    const unitSelect = row.querySelector(".ing-unit");
                    const hiddenId = row.querySelector(".ing-id");
                    const importance = Number(row.querySelector(".ing-importance")?.value) ?? 2;
                    
                    const name = nameInput?.value?.trim();
                    const qtyStr = qtyInput?.value?.trim();
                    const unit = unitSelect?.value?.trim() || '';
                    const ingredientId = hiddenId?.value?.trim() || name;
                    
                    if (name && qtyStr) {
                        const quantity = isNaN(parseFloat(qtyStr)) ? qtyStr : parseFloat(qtyStr);
                        recipe.ingredients.push({
                            ingredientId: ingredientId,
                            quantity: quantity,
                            unit: unit,
                            importance: importance
                        });
                    }
                });
                
                block.querySelectorAll(".step-row input.step-text").forEach(input => {
                    const text = input.value.trim();
                    if (text) recipe.steps.push(text);
                });
                
                recipes.push(recipe);
            });
            
            const output = document.getElementById("output");
            
            if (recipes.length === 0) {
                output.textContent = "Добавь хотя бы один рецепт с названием и id :)";
                output.className = "empty-state";
                return;
            }
            
            const jsonStr = formatRecipeJSON(recipes.length === 1 ? recipes[0] : recipes);
            output.textContent = jsonStr;
            output.className = "";
        }

        // =============================================
        // Копирование JSON
        // =============================================
        function copyJSON(){
            const output = document.getElementById("output");
            const text = output.textContent;
            
            if (!text || output.classList.contains("empty-state")) {
                alert("Сначала создайте JSON, нажав «Создать JSON»!");
                return;
            }
            
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById("copy-btn");
                const originalText = btn.textContent;
                btn.textContent = "✓ Скопировано!";
                btn.classList.add("copied");
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove("copied");
                }, 2000);
            }).catch(err => {
                console.error("Ошибка копирования:", err);
                alert("Не удалось скопировать. Выделите текст и нажмите Ctrl+C.");
            });
        }

        // =============================================
        // Закрытие всех дропдаунов при клике вне
        // =============================================
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.autocomplete-wrapper')) {
                document.querySelectorAll('.autocomplete-dropdown').forEach(d => {
                    d.classList.remove('show');
                });
                activeDropdown = null;
            }
        });

        // =============================================
        // Инициализация
        // =============================================
        window.onload = async () => {
            await loadIngredients();
            createRecipeBlock(); // создаём первый рецепт
        };
    </script>
</body>
</html>
