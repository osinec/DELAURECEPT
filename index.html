<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Редактор нескольких рецептов → JSON массив</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 30px 20px 100px;
      color: #222;
      line-height: 1.5;
    }
    .container {
      max-width: 1180px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #c2410c;
      margin-bottom: 40px;
      font-size: 2.2rem;
    }
    .recipe-block {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 24px 28px;
      margin-bottom: 32px;
      position: relative;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .recipe-block h2 {
      margin: 0 0 20px;
      color: #9a3412;
      font-size: 1.4rem;
    }
    .remove-btn {
      position: absolute;
      top: 16px;
      right: 20px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .remove-btn:hover {
      background: #dc2626;
    }
    .form-grid {
      display: grid;
      gap: 20px;
      grid-template-columns: 180px 1fr;
      align-items: start;
    }
    .form-grid label {
      font-weight: 600;
      color: #444;
      padding-top: 10px;
      text-align: right;
    }
    input, textarea {
      padding: 12px 16px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1.05rem;
      background: white;
      width: 100%;
      box-sizing: border-box;
    }
    textarea {
      font-family: 'Consolas', 'Courier New', monospace;
      line-height: 1.5;
      resize: vertical;
      min-height: 140px;
    }
    .section-title {
      grid-column: 1 / -1;
      font-size: 1.25rem;
      font-weight: 700;
      color: #444;
      margin: 20px 0 8px;
    }
    .add-recipe-btn {
      display: block;
      margin: 0 auto 40px;
      padding: 16px 48px;
      font-size: 1.15rem;
      background: #10b981;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .add-recipe-btn:hover {
      background: #059669;
    }
    #json-output {
      width: 100%;
      height: 560px;
      margin-top: 40px;
      padding: 24px;
      background: #1f2937;
      color: #e5e7eb;
      font-family: 'Consolas', monospace;
      border-radius: 10px;
      white-space: pre;
      overflow: auto;
      border: 1px solid #374151;
      font-size: 0.97rem;
      line-height: 1.45;
    }
    .actions {
      text-align: center;
      margin: 48px 0;
    }
    button.main-btn {
      padding: 16px 56px;
      font-size: 1.18rem;
      background: #f97316;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    button.main-btn:hover {
      background: #ea580c;
    }
    small {
      color: #6b7280;
      font-size: 0.92rem;
      display: block;
      margin-top: 6px;
    }
    @media (max-width: 768px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
      .form-grid label {
        text-align: left;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Редактор нескольких рецептов</h1>

  <div id="recipes-container">
    <!-- сюда будут добавляться блоки рецептов -->
  </div>

  <button class="add-recipe-btn" onclick="addRecipeBlock()">+ Добавить ещё один рецепт</button>

  <div class="actions">
    <button class="main-btn" onclick="generateAllJson()">Сформировать JSON-массив</button>
  </div>

  <pre id="json-output">[]</pre>
</div>

<script>
// Глобальный счётчик для уникальных id блоков
let recipeCounter = 0;

function addRecipeBlock(initialData = {}) {
  recipeCounter++;
  const id = `recipe-${recipeCounter}`;

  const block = document.createElement('div');
  block.className = 'recipe-block';
  block.id = id;
  block.innerHTML = `
    <h2>Рецепт ${recipeCounter}</h2>
    <button class="remove-btn" onclick="removeRecipeBlock('${id}')">Удалить рецепт</button>

    <div class="form-grid">

      <label for="${id}-title">Название:</label>
      <div>
        <input type="text" id="${id}-title" value="${initialData.title || ''}" placeholder="Например: Картошка с курицей в духовке" oninput="generateAllJson()">
        <small>От названия будет имя файла фото (.webp)</small>
      </div>

      <label for="${id}-photo">Фото:</label>
      <input type="text" id="${id}-photo" value="${initialData.photo || ''}" placeholder="автоматически имя-рецепта.webp" oninput="generateAllJson()">

      <label for="${id}-time">Время:</label>
      <input type="text" id="${id}-time" value="${initialData.time || ''}" placeholder="например: 75 минут" oninput="generateAllJson()">

      <label for="${id}-calories">Калории:</label>
      <input type="number" id="${id}-calories" value="${initialData.calories || ''}" placeholder="на 100 г / на порцию" oninput="generateAllJson()">

      <div class="section-title">Ингредиенты</div>
      <div style="grid-column: 1 / -1;">
        <textarea id="${id}-ingredients" rows="12" placeholder="по одному на строку" oninput="generateAllJson()">${(initialData.ingredients || []).join('\n')}</textarea>
        <small>Скобки отрежутся, количество → длинное тире автоматически</small>
      </div>

      <div class="section-title">Шаги приготовления</div>
      <div style="grid-column: 1 / -1;">
        <textarea id="${id}-steps" rows="14" placeholder="по одному шагу на строку" oninput="generateAllJson()">${(initialData.steps || []).map(s => s.replace(/^\d+\.\s*/, '')).join('\n')}</textarea>
        <small>Шаги будут пронумерованы в JSON автоматически</small>
      </div>

    </div>
  `;

  document.getElementById('recipes-container').appendChild(block);
  generateAllJson();
}

function removeRecipeBlock(blockId) {
  const block = document.getElementById(blockId);
  if (block) {
    block.remove();
    generateAllJson();
  }
}

function cleanIngredient(line) {
  let s = line.trim();
  if (!s) return '';

  s = s.replace(/\s*\([^)]*\)\s*$/, '').trim();

  const match = s.match(/^(.*?)\s*([0-9½⅓⅔¼¾ ,./-]+\s*[гмлкгч.лст.ч.лшт.банокупаковштукгран кусочков]*)$/i);

  if (match && match[1] && match[2]) {
    let name = match[1].trim();
    let qty  = match[2].trim().replace(/\.$/, '');
    return `${name} — ${qty}`;
  }

  return s;
}

function autoPhoto(title, manualPhoto) {
  let photo = manualPhoto.trim();

  if (!photo && title) {
    photo = title
      .toLowerCase()
      .replace(/[^a-zа-яё0-9\s-]/gi, '')
      .replace(/\s+/g, '-')
      .replace(/-+/g, '-')
      .replace(/^-|-$/g, '');
    if (photo) photo += '.webp';
  } else if (photo && !photo.toLowerCase().endsWith('.webp')) {
    if (!/\.[a-z]{3,4}$/i.test(photo)) {
      photo += '.webp';
    }
  }

  return photo;
}

function generateAllJson() {
  const recipes = [];

  document.querySelectorAll('.recipe-block').forEach(block => {
    const id = block.id;

    const title    = (document.getElementById(`${id}-title`)?.value || '').trim();
    const photoRaw = (document.getElementById(`${id}-photo`)?.value || '').trim();
    const photo    = autoPhoto(title, photoRaw);
    const time     = (document.getElementById(`${id}-time`)?.value || '').trim();
    const calories = Number(document.getElementById(`${id}-calories`)?.value) || 0;

    // Ингредиенты
    const ingText = (document.getElementById(`${id}-ingredients`)?.value || '');
    const ingredients = ingText
      .split('\n')
      .map(cleanIngredient)
      .filter(Boolean);

    // Шаги с нумерацией
    const stepsText = (document.getElementById(`${id}-steps`)?.value || '').trim();
    const rawSteps = stepsText
      .split('\n')
      .map(s => s.trim())
      .filter(Boolean);
    const steps = rawSteps.map((step, i) => `${i + 1}. ${step}`);

    if (title || ingredients.length > 0 || steps.length > 0) {
      recipes.push({
        title,
        photo,
        ingredients,
        steps,
        time,
        calories
      });
    }
  });

  const jsonStr = JSON.stringify(recipes, null, 2);
  document.getElementById('json-output').textContent = jsonStr || '[]';
}

// Создаём первый пустой рецепт при загрузке
window.onload = () => {
  addRecipeBlock();
};
</script>

</body>
</html>
